name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Validate site content
        run: python scripts/check_content.py

      - name: Validate workflow contracts
        run: python scripts/check_workflows.py

      - name: Build documentation
        run: mkdocs build --strict

      - name: Validate local links and built artifacts
        run: python scripts/check_local_links.py --site-dir site
